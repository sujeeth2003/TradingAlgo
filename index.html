<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlgoTrade Lab — Strategy Backtesting System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg:        #0a0c10;
    --surface:   #111318;
    --surface2:  #181c24;
    --border:    #1e2430;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --accent:    #38bdf8;
    --green:     #22c55e;
    --red:       #ef4444;
    --amber:     #f59e0b;
    --purple:    #a78bfa;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    backdrop-filter: blur(12px);
  }

  .logo {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .logo span { color: var(--muted); font-weight: 300; }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: calc(100vh - 60px);
  }

  /* ── Sidebar ── */
  sidebar {
    border-right: 1px solid var(--border);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow-y: auto;
    height: calc(100vh - 60px);
    position: sticky;
    top: 60px;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* Strategy cards */
  .strategy-cards {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .strategy-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .strategy-card:hover {
    border-color: var(--accent);
    background: var(--surface);
  }

  .strategy-card.active {
    border-color: var(--accent);
    background: rgba(56, 189, 248, 0.06);
  }

  .strategy-card.active::before {
    content: '';
    position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 3px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
  }

  .strategy-name {
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .strategy-desc {
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.5;
  }

  /* Params */
  .param-group {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .param-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .param-label {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: var(--mono);
  }

  .param-label span {
    float: right;
    color: var(--accent);
    font-weight: 600;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(56,189,248,0.5);
  }

  .text-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.78rem;
    padding: 8px 10px;
    border-radius: 6px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }

  .text-input:focus { border-color: var(--accent); }

  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  /* Run button */
  .run-btn {
    background: var(--accent);
    color: #0a0c10;
    font-family: var(--mono);
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .run-btn:hover { filter: brightness(1.15); }
  .run-btn:active { transform: scale(0.98); }
  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Main ── */
  main {
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    min-width: 0;
  }

  /* Metrics strip */
  .metrics-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
  }

  .metric-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    transition: border-color 0.2s;
  }

  .metric-card:hover { border-color: var(--accent); }

  .metric-label {
    font-size: 0.67rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: var(--mono);
    margin-bottom: 8px;
  }

  .metric-value {
    font-family: var(--mono);
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1;
  }

  .metric-value.pos { color: var(--green); }
  .metric-value.neg { color: var(--red); }
  .metric-value.neu { color: var(--text); }
  .metric-value.acc { color: var(--accent); }

  /* Chart panels */
  .chart-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    position: relative;
  }

  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .chart-title {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .chart-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 0.65rem;
    padding: 3px 8px;
    border-radius: 4px;
    color: var(--muted);
  }

  .chart-container { position: relative; }
  .chart-container canvas { width: 100% !important; }

  /* Regime overlay legend */
  .legend {
    display: flex;
    gap: 16px;
    font-size: 0.7rem;
    color: var(--muted);
    font-family: var(--mono);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
  }

  /* Trade log */
  .trade-log {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .trade-log-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .trade-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 0.75rem;
  }

  .trade-table th {
    text-align: left;
    padding: 10px 24px;
    color: var(--muted);
    font-size: 0.67rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    font-weight: 500;
  }

  .trade-table td {
    padding: 10px 24px;
    border-bottom: 1px solid rgba(30,36,48,0.5);
  }

  .trade-table tr:hover td { background: var(--surface2); }

  .action-badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .action-BUY   { background: rgba(34,197,94,0.15);  color: var(--green);  }
  .action-SELL  { background: rgba(239,68,68,0.15);  color: var(--red);    }
  .action-SHORT { background: rgba(167,139,250,0.15); color: var(--purple); }
  .action-COVER { background: rgba(245,158,11,0.15); color: var(--amber);  }

  /* Loading overlay */
  .loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,12,16,0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    backdrop-filter: blur(4px);
  }

  .loading-overlay.show { display: flex; }

  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--accent);
    letter-spacing: 1px;
  }

  /* Error banner */
  .error-banner {
    display: none;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--red);
  }

  .error-banner.show { display: block; }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 300px;
    color: var(--muted);
    gap: 12px;
    font-family: var(--mono);
    font-size: 0.82rem;
  }

  .empty-icon { font-size: 2.5rem; opacity: 0.3; }

  /* Checkbox toggle */
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .toggle {
    position: relative;
    width: 36px; height: 20px;
  }

  .toggle input { opacity: 0; width: 0; height: 0; }

  .toggle-slider {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 20px;
    cursor: pointer;
    transition: 0.2s;
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    left: 3px; top: 3px;
    width: 14px; height: 14px;
    background: var(--muted);
    border-radius: 50%;
    transition: 0.2s;
  }
